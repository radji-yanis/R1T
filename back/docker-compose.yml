name: r1t

services:
  db:
    image: postgres:16
    container_name: r1t-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - r1t-data:/var/lib/postgresql/data

volumes:
  r1t-data: